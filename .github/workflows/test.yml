# Unit and integration tests on Windows and Linux. macOS is not tested here, so the macOS-only
# paths (HEIC import, and image export and the flipbook through sips) are not covered by CI.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run fixtures
      - run: npm test
      - run: npm run build
      - run: npx vite build --mode pages
