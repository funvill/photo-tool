# Unit and integration tests, on every platform the local app runs on. HEIC import, image export
# and the flipbook use the built-in sips, so those tests (and the HEIC fixture) are macOS-only.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run fixtures
      - run: npm test
      - run: npm run build:editor && npm run build:photo-tool
